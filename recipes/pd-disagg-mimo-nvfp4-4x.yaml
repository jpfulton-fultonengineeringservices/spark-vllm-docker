# PD-disaggregated MiMo-V2.6-Flash-RL-NVFP4 (4-node GB10)
#
# 4-node topology: ranks 0-1 PREFILL NVFP4 TP=2 sub-group, API 8100,
# kv_producer, GMU 0.7; ranks 2-3 DECODE NVFP4 TP=2 + DFlash, API 8200,
# kv_consumer, GMU 0.7. Same proven 2x footprint shape as the EXL3 twin.
#
# ModelOpt MIXED_PRECISION: routed experts NVFP4 (W4A4), dense/attention
# FP8_PB_WO (4-D `weight_scale`). Requires the ModelOpt load bridge
# (`mods/mimo-v2.6-flash-rl-nvfp4`). No `exl3-mimo`.
#
# Flags: `--quantization modelopt_mixed --load-format b12x --moe-backend b12x`.
# DFlash, mooncake KV, and B12X kernels identical to the EXL3 twin.
#
# Launch via cluster-config serve.sh:
#   spark-vllm-docker-serve.sh --recipe pd-disagg-mimo-nvfp4-4x \
#     --rank-order <4 hosts> --daemon

recipe_version: "1"
name: MiMo-V2.6-Flash-RL-NVFP4 PD-Disaggregated
description: "vLLM PD-disaggregated MiMo-V2.6-Flash-RL-NVFP4 (modelopt_mixed + b12x) TP=2 prefill/decode sub-groups, host-staged KV, vllm-router (4-node GB10)"

model: XiaomiMiMo/MiMo-V2.6-Flash-RL-NVFP4

container: vllm-node-b12x

build_args:
  - --exp-b12x

cluster_only:

mods:
  - mods/fes-weights
  - mods/mimo-v2.6-flash
  - mods/mimo-v2.6-flash-rl-nvfp4
  - mods/mimo-diffkv-fp8-kv
  - mods/kv-cache-guard-override
  - mods/pd-disagg
  - mods/mooncake-worker
  - mods/mm-media-deps
  - mods/b12x-kernel-cache
  - mods/b12x-reclaim-gate

defaults:
  port: 8000
  pd_router_port: 8000
  pd_prefill_port: 8100
  pd_decode_port: 8200
  pd_mooncake_master_port: 50051
  pd_mooncake_client_port: 50053
  pd_kv_backend: mooncake
  pd_mooncake_segment_size_gib: 8
  pd_mooncake_offload_max_gib: 100
  pd_decode_master_port: 29502
  pd_tp_prefill: 2
  pd_tp_decode: 2
  # Per-role batch/concurrency (NOT in PD_PARITY_SHA256 -- roles may differ).
  # Prefill: small batches, throughput-oriented seq count. Decode: decode-only
  # max concurrency. The dispatcher emits these on their respective roles.
  pd_max_num_seqs_prefill: 32
  pd_max_num_batched_tokens_prefill: 4096
  pd_max_num_seqs_decode: 48
  pd_max_num_batched_tokens_decode: 16384
  num_speculative_tokens: 7
  max_model_len: 1048576
  block_size: 128
  max_num_seqs: 32
  max_num_batched_tokens: 16384

env:
  PD_DISAGG_ENABLED: "1"
  PD_VLLM_SERVE: "b12x-kcache exec vllm serve"
  MIMO_V26_MODEL_ID: "XiaomiMiMo/MiMo-V2.6-Flash-RL-NVFP4"
  PD_QUANTIZATION: "modelopt_mixed"
  PD_MODEL: "XiaomiMiMo/MiMo-V2.6-Flash-RL-NVFP4"
  PD_LOAD_FORMAT: "b12x"
  PD_MOE_BACKEND: "b12x"
  # Memory-tight TP=2 shape (85.87 GiB weights/rank on a 120.5 GiB UMA):
  # shrink the decode pinned recv window (long contexts then chunk over more
  # rounds). PD_LIMIT_MM_PER_PROMPT is NOT set here -- run-recipe emits env:
  # values as `export K="{v}"`, whose outer double quotes destroy the JSON's
  # inner quotes; it is passed as a single-quoted command-prefix instead, and
  # that prefix also seeds the env for dispatch.sh.
  PD_STAGING_RECV_MIB: "2048"
  # Skip the P2P-inert mooncake-client cohort (~8 GiB/node store DRAM that the
  # engine-to-engine data path never reads) to protect UMA headroom.
  PD_MOONCAKE_SKIP_CLIENT: "1"
  # GMU sizing: vLLM's request_memory = ceil(TOTAL * GMU) must be <= the
  # engine's free UMA at start (worker/utils.py raise -- VLLM_SKIP_KV_CACHE_
  # MEMORY_CHECK does NOT cover it), and weights alone are 85.87 GiB/rank.
  # Decode hosts (node3/node4) carry ~13 GiB co-tenants (bge-m3 embed 7.5 +
  # headroom 2.1 + lmcache-server 1.9) and measure only ~91 GiB FREE at engine
  # start (worst = node4). ceil(120.5*GMU) <= free forces GMU <= ~0.756 on the
  # decode role, so decode = 0.75 (prefill nodes measure 107/113 GiB free ->
  # 0.80 fits). This leaves only ~5-10 GiB for KV + activations + cudagraph on
  # TP=2 -- the tight ceiling of a 120.5 GiB box. For comfortable headroom,
  # stop the bge-m3 embed fleet on the decode hosts (~8 GiB) or run TP=4
  # (~46 GiB/rank). PD_PREFILL_GMU / PD_DECODE_GMU are role-specific (not in
  # the parity hash).
  PD_PREFILL_GMU: "0.80"
  PD_DECODE_GMU: "0.75"
  CUTE_DSL_ARCH: "sm_121a"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_SKIP_KV_CACHE_MEMORY_CHECK: "1"
  TORCHINDUCTOR_CACHE_DIR: "/root/.cache/torchinductor"
  HF_HUB_OFFLINE: "1"
  B12X_SKIP_RECLAIM: "1"

command: PD_KV_BACKEND={pd_kv_backend} PD_PREFILL_PORT={pd_prefill_port} PD_DECODE_PORT={pd_decode_port} PD_ROUTER_PORT={pd_router_port} PD_NUM_SPECULATIVE_TOKENS={num_speculative_tokens} PD_MAX_MODEL_LEN={max_model_len} PD_BLOCK_SIZE={block_size} PD_MAX_NUM_SEQS={max_num_seqs} PD_MAX_NUM_BATCHED_TOKENS={max_num_batched_tokens} PD_MAX_NUM_SEQS_PREFILL={pd_max_num_seqs_prefill} PD_MAX_NUM_BATCHED_TOKENS_PREFILL={pd_max_num_batched_tokens_prefill} PD_MAX_NUM_SEQS_DECODE={pd_max_num_seqs_decode} PD_MAX_NUM_BATCHED_TOKENS_DECODE={pd_max_num_batched_tokens_decode} PD_LIMIT_MM_PER_PROMPT='{{"image":0,"video":0,"audio":0}}' PD_TP_PREFILL={pd_tp_prefill} PD_TP_DECODE={pd_tp_decode} PD_DECODE_MASTER_PORT={pd_decode_master_port} /workspace/mods/pd-disagg/dispatch.sh
