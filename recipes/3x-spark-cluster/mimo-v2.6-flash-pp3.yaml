# Recipe: MiMo-V2.6-Flash-RL 3x (b12x, PP=3)
# TP=1 + pipeline parallelism across three DGX Spark nodes using the b12x
# serving stack (B12X attention / MoE / linear / loader) from the 4x recipe.
#
# Why PP=3 and not TP=3: none of the model's shardable dimensions divide by 3
# (64 query heads, 4 global / 8 SWA KV heads, hidden 4096, MoE intermediate
# 2048, 256 routed experts), so Megatron-style tensor parallelism refuses
# TP=3. Legal TP degrees are 1/2/4/8. PP=3 is the only topology that uses all
# three nodes for one model (the same reason the qwen 3x recipe is PP=3).
#
# DFlash under PP: the drafter consumes target aux hidden states at
# dflash/config.json target_layer_ids [0, 11, 23, 35, 47], which span all
# three PP stages (16 layers each). vLLM relays non-local aux states to the
# last rank generically but gates it behind supports_aux_hidden_states_over_pp,
# which MiMoV2Model does not set -- startup would abort with "MiMoV2Flash-
# ForCausalLM does not support dflash with pipeline parallelism". The
# mods/mimo-v2-aux-over-pp mod flips that opt-in. The same mod replicates the
# target's embed_tokens on every PP stage: the drafter ships no embedding of
# its own and borrows the target's, which under PP lives only on stage 0 while
# the drafter lives on the last stage (without the fix drafter load aborts
# with "needs the target input embedding, but it is unavailable on this PP
# stage"; cost ~1.25 GiB per extra stage). Drafts stay self-verified
# against target logits: a drafter problem costs acceptance rate, not output
# correctness.
#
# Memory (121.6 GiB unified pool per node, ~173 GB weights):
# - per-rank target weights ~58 GB (1/3 of the checkpoint); the last rank adds
#   the LM head plus the whole DFlash drafter (~5 layers, ~3 GB) and is the
#   heaviest stage.
# - KV capacity at TP=1, corrected 2026-10-01: the clean two-group layout
#   (target + independent draft group) needs 33.84 GiB to hold a single
#   1M-token request, vs 27.17 GiB available at gpu_memory_utilization 0.80
#   (kept at the 4x value so the resident FES bge-m3 embed units keep
#   co-existing; raise it for standalone use). An earlier estimate claiming
#   the 1M context fits with wide margin was wrong (it measured the broken
#   shared-stride layout). Observed fleet workloads peak far below the
#   single-request worst case (TP=4: 22% KV util at 8 concurrent), so the
#   recipe runs with VLLM_SKIP_KV_CACHE_MEMORY_CHECK=1 and keeps the full
#   1M max_model_len; a request beyond the pool queues instead of crashing.
#   Single-request fit at this memory: ~698K tokens.
#
# b12x at TP=1: hidden 4096%256=0 and MoE intermediate 2048%32=0 hold, so the
# same backends as the 4x recipe apply. --block-size 128 is required by b12x
# attention. Target KV cache is fp8 on ALL layers (no
# --kv-cache-dtype-skip-layers, unlike the 4x recipe): at TP=1 the skip-layers
# page path produced padded pages the b12x kernel prep rejects ("k_cache page
# stride must be a whole number of token rows: stride(0)=524288,
# stride(1)=320" - the padded page came from the bf16 drafter and page
# unification carried it onto the target's 320-byte-row tensors). All-fp8
# takes the natural-page path the 2x recipe proves; the SWA layers' 128-token
# rings in fp8 instead of bf16 cost a few MiB. The DFlash drafter keeps bf16
# KV via the speculative config's kv_cache_dtype (see below) because b12x's
# noncausal path requires it.
#
# Mod order: fes-weights FIRST (verifies the FES-staged mount and builds the
# hub-cache shim the drafter staging resolves against; inert without
# FES_WEIGHTS_ENABLED=1, see docs/fes-weight-staging.md), then drafter
# staging, then the two mimo_v2.py source patches (disjoint regions), with
# mimo-v2-aux-over-pp LAST.
#
# V2 model runner is pinned: DFlash drafting is rejected on the V1 runner.
# --async-scheduling is deliberately OFF with PP=3 (2026-10-01): async
# scheduling reorders per-rank enqueue of the PP send/recv ops, NCCL p2p
# matches strictly by post order, and the first real step wedged permanently
# (PP2 spun in b12x plan prep with the GPU stalled on an unmatched recv; the
# head logged "An unbatched P2P op ... new 2-rank NCCL communicator" just
# before). Keep it off for any PP>1 topology; the single-node recipes (4x)
# run it without issue since they have no PP p2p.
#
# First-launch gates and the failure fallback (dropping --speculative-config
# to isolate drafter from target) are documented in
# mods/mimo-v2-aux-over-pp/README.md.

recipe_version: "1"
name: MiMo-V2.6-Flash-RL 3x (PP=3)
description: vLLM serving XiaomiMiMo/MiMo-V2.6-Flash-RL with DFlash speculative decoding on a three-node DGX Spark cluster (PP=3, TP=1, b12x stack)

# HuggingFace model to download (optional, for --download-model)
model: XiaomiMiMo/MiMo-V2.6-Flash-RL

# Container image: b12x fork (local-inference-lab/vllm@dev/karmic-kraken) with
# B12X paged attention (DiffKV + fp8 KV + sinks + non-causal), b12x MoE (MXFP4
# w4a8_mx), b12x linear, and b12x async checkpoint loader. Build with:
#   ./build-and-copy.sh --exp-b12x -t vllm-node-b12x
container: vllm-node-b12x

build_args:
  - --exp-b12x

# ~173 GB of weights: needs all three Sparks
cluster_only: true

mods:
  - mods/fes-weights
  - mods/mimo-v2.6-flash
  - mods/mimo-diffkv-fp8-kv
  - mods/mimo-v2-aux-over-pp
  - mods/b12x-kv-group-lookup
  - mods/kv-cache-guard-override
  - mods/diag-kv-groups

# Default settings (can be overridden via CLI where supported)
defaults:
  port: 8000
  host: 0.0.0.0
  pipeline_parallel: 3
  gpu_memory_utilization: 0.80
  max_model_len: 1048576
  block_size: 128
  max_num_seqs: 32
  max_num_batched_tokens: 16384
  num_speculative_tokens: 7

# Environment variables
# CUTE_DSL_ARCH: CuTe DSL compiler target for b12x kernel compilation.
# VLLM_USE_V2_MODEL_RUNNER: pin the V2 runner (DFlash drafting is rejected on
# the V1 runner) and keep the pin from silently mattering if the fork's
# auto-resolution changes.
env:
  CUTE_DSL_ARCH: "sm_121a"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  # Skip the startup KV memory guard (needs mods/kv-cache-guard-override).
  # The guard demands one request fit the full 1M max_model_len in KV (33.84
  # GiB vs 27.17 GiB available at gmu 0.80); fleet workloads never approach
  # that (TP=4 peaks at 22% KV util with 8 concurrent sequences), and a
  # request that outgrows the pool queues instead of crashing.
  VLLM_SKIP_KV_CACHE_MEMORY_CHECK: "1"

# The vLLM serve command template. Same stack as recipes/mimo-v2.6-flash-4x.yaml
# with the parallelism rewritten for three nodes (TP is fixed at 1; the
# launcher derives the node count from tp * pp * dp = 3).
# - --attention-backend B12X: DiffKV (192/128 K/V head dims), fp8 KV, attention
#   sinks, sliding window, and non-causal (needed by DFlash).
# - --moe-backend b12x: fused MoE for the MXFP4 experts (w4a8_mx).
# - --linear-backend b12x: b12x GEMM kernels for linear projections.
# - --load-format b12x: async io_uring/CUDA-copy ring for checkpoint loading.
# - --block-size 128: b12x attention requires block size 64 or 128.
# - --kv-cache-dtype fp8 on all layers (no --kv-cache-dtype-skip-layers): the
#   skip-layers page path breaks b12x kernel prep at TP=1 (see the header
#   note). All-fp8 keeps the natural-page path; the mimo-diffkv-fp8-kv mod's
#   page-floor patches are conditional on the skip page and stay inert here.
# - --speculative-config attention_backend B12X: run the drafter on B12X (it
#   supports the non-causal attention DFlash needs) on the last PP rank.
#   kv_cache_dtype bfloat16 is REQUIRED and drafter-scoped: b12x's noncausal
#   path raises "B12X noncausal attention requires BF16 KV and equal QK/V
#   dimensions" (the drafter's equal 128/128 dims pass; the bf16 must not be
#   global - the target keeps fp8 KV). Without this key the drafter inherits
#   the target's fp8 and aborts at construction.
# - FULL_AND_PIECEWISE + custom_ops all: piecewise prefill graphs on top of
#   full decode graphs, valid only on the pinned V2 runner.
command: |
  vllm serve XiaomiMiMo/MiMo-V2.6-Flash-RL \
      --trust-remote-code \
      --host {host} \
      --port {port} \
      --tensor-parallel-size 1 \
      --pipeline-parallel-size {pipeline_parallel} \
      --moe-backend b12x \
      --linear-backend b12x \
      --attention-backend B12X \
      --load-format b12x \
      --block-size {block_size} \
      --max-model-len {max_model_len} \
      --kv-cache-dtype fp8 \
      --max-num-seqs {max_num_seqs} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --enable-chunked-prefill \
      --enable-prefix-caching \
      --speculative-config '{{"method":"dflash","model":"/workspace/MiMo-V2.6-Flash-RL-dflash","num_speculative_tokens":{num_speculative_tokens},"attention_backend":"B12X","kv_cache_dtype":"bfloat16"}}' \
      --compilation-config '{{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}}' \
      --generation-config vllm \
      --override-generation-config '{{"top_p":0.95}}' \
      --reasoning-parser mimo \
      --tool-call-parser mimo \
      --enable-auto-tool-choice \
      --kv-cache-metrics \
      --enable-mfu-metrics
