# Recipe: MiMo-V2.6-Flash-RL-UNCENSORED EXL3 (two DGX Spark, TP=2, LMCache offload)
#
# Same serve shape as recipes/mimo-v2.6-flash-rl-uncensored-exl3-2x.yaml (same
# b12x exl3-v1 pack, same TP=2, same DFlash drafter), PLUS in-process
# LMCacheConnectorV1 for KV offload + durability ONLY -- no prefill/decode
# disaggregation, no RDMA KV transfer. LMCache tiering:
#   L1 = host DRAM (local_cpu), L2 = fs_native on the shared NFS under a
#   per-node subdir (/cluster-shared/lmcache-l2/<host>) + Valkey on Dell.
# The mods/lmcache-offload run.sh installs the lmcache wheel the vllm-node-b12x
# image lacks and renders the YAML this recipe points LMCACHE_CONFIG_FILE at.
#
# HMA note: LMCacheConnectorV1 does not declare SupportsHMA, so vLLM auto-sets
# disable_hybrid_kv_cache_manager and MiMo's DiffKV/sliding-window layers
# collapse into ONE KV cache group -- the single-group invariant the LMCache v1
# adapter requires. The explicit --disable-hybrid-kv-cache-manager flag makes
# this deterministic and is the same state the live 4x PD-lmcache stack is
# missing (its external LMCacheMPConnector claims HMA support, leaving hybrid
# groups on and tripping 'engine-driven transfer does not support hybrid KV
# cache groups'). Prefix caching STAYS on (unlike the MP connector, the
# in-process v1 connector coexists with it).
#
# Model/staging/launch: identical to the 2x recipe header -- staged
# mimo-v2.6-flash-rl-uncensored-exl3-v1 slug via SPARK_VLLM_DOCKER_SLUGS,
# launched on the head rank with --rank-order gx10-becc:0,gx10-9273:1.

recipe_version: "1"
name: MiMo-V2.6-Flash-RL-UNCENSORED EXL3 2x LMCache
description: vLLM serving a MiMo-V2.6-Flash-RL-UNCENSORED EXL3 pack (B12X exl3-v1 container, DFlash speculative decoding) on two DGX Spark nodes (TP=2, b12x stack, exl3 quant method) with LMCacheConnectorV1 KV offload + durability (L1 DRAM, L2 fs_native NFS + Valkey; no PD transfer)

# Local exl3-v1 serving checkpoint, staged by the FES weights path under this
# hub id. Not a downloadable repo — use the staged launch (see header).
model: XiaomiMiMo/MiMo-V2.6-Flash-RL-EXL3

# b12x fork (local-inference-lab/vllm@dev/karmic-kraken) with B12X paged
# attention (DiffKV + fp8 KV + sinks + non-causal) and b12x linear. Build with:
#   ./build-and-copy.sh --exp-b12x -t vllm-node-b12x
container: vllm-node-b12x

build_args:
  - --exp-b12x

# 2 nodes: the experts-only EXL3 pack is ~110 GB total, ~55 GB/rank at TP=2, so
# two nodes leave room for fp8 KV and the resident embed units.
cluster_only: true

# exl3-mimo relaxes the fork's DeepSeek-shaped EXL3 gates for MiMo (SiLU +
# non-DeepSeek dense arrangement). mimo-v2.6-flash carries the model-support
# patches and stages the DFlash drafter; kv-cache-guard-override skips the
# single-request 1M KV guard. lmcache-offload installs the lmcache wheel and
# renders the offload/durability config (L1 DRAM, L2 fs_native NFS + Valkey).
mods:
  - mods/fes-weights
  - mods/mimo-v2.6-flash
  - mods/exl3-mimo
  - mods/mimo-diffkv-fp8-kv
  - mods/kv-cache-guard-override
  - mods/b12x-kernel-cache
  - mods/b12x-reclaim-gate
  - mods/lmcache-offload

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  # ~55 GB experts/rank + non-expert weights + fp8 KV at TP=2; 0.8 also leaves
  # room for the resident embed units (~0.10), matching the flagship b12x
  # recipes' 0.80 + embed co-existence budget.
  gpu_memory_utilization: 0.7
  max_model_len: 1048576
  block_size: 128
  max_num_seqs: 32
  max_num_batched_tokens: 16384
  # DFlash speculative decoding: draft length 7 (same as the coherent-proven
  # exl3-4x recipe).
  num_speculative_tokens: 7

env:
  CUTE_DSL_ARCH: "sm_121a"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_SKIP_KV_CACHE_MEMORY_CHECK: "1"
  # The mimo-v2.6-flash mod resolves its DFlash drafter from the served
  # snapshot of MIMO_V26_MODEL_ID; point it at this (assembled) checkpoint so it
  # finds dflash/ there rather than the source MiMo repo.
  MIMO_V26_MODEL_ID: "XiaomiMiMo/MiMo-V2.6-Flash-RL-EXL3"
  # Persist the torch inductor Triton autotuner cache (cubin files) outside
  # /tmp so b12x-kcache can archive it alongside the b12x compile/preparation
  # roots. Without this, /tmp/torchinductor_root is ephemeral and every boot
  # re-compiles Triton kernels (the "Failed to reload cubin file" warnings).
  TORCHINDUCTOR_CACHE_DIR: "/root/.cache/torchinductor"
  # LMCache offload: enable the mod and point the connector at the YAML it
  # renders (same path the mod writes). A mod CANNOT export env for the serve
  # exec (separate process), so the pointer lives here.
  LMCACHE_OFFLOAD_ENABLED: "1"
  LMCACHE_CONFIG_FILE: "/tmp/lmcache-config.yaml"
  # b12x-reclaim-gate: LMCacheConnectorV1 registers KV memory, which joins
  # b12x's retained-owner set -- the same condition that makes b12x's
  # evict_unretained reclamation sweep spin at 100% CPU with no cycle guard
  # (observed live 2026-10-11: worker wedged in
  # b12x/_lib/compile_plan.py retained_program_keys via evict_unretained,
  # determine_available_memory never returning). Skip the sweep. See
  # mods/b12x-reclaim-gate/README.md.
  B12X_SKIP_RECLAIM: "1"

command: |
  # LMCacheConnectorV1 pins/registers KV memory; PyTorch's CUDA-VMM
  # expandable_segments remaps KV virtual addresses and invalidates registered
  # memory (the same constraint the PD dispatch.sh unsets at mods/pd-disagg/
  # dispatch.sh:80-85; vLLM errors at boot if it's set without the cumem
  # allocator). launch-cluster.sh exports expandable_segments:True by default.
  unset PYTORCH_CUDA_ALLOC_CONF
  b12x-kcache exec vllm serve XiaomiMiMo/MiMo-V2.6-Flash-RL-EXL3 \
      --trust-remote-code \
      --host {host} \
      --port {port} \
      --tensor-parallel-size {tensor_parallel} \
      --quantization exl3 \
      --attention-backend B12X \
      --linear-backend b12x \
      --block-size {block_size} \
      --max-model-len {max_model_len} \
      --kv-cache-dtype fp8 \
      --kv-cache-dtype-skip-layers sliding_window \
      --max-num-seqs {max_num_seqs} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --enable-chunked-prefill \
      --async-scheduling \
      --enable-prefix-caching \
      --disable-hybrid-kv-cache-manager \
      --kv-transfer-config '{{"kv_connector":"LMCacheConnectorV1","kv_role":"kv_both"}}' \
      --speculative-config '{{"method":"dflash","model":"/workspace/MiMo-V2.6-Flash-RL-dflash","num_speculative_tokens":{num_speculative_tokens},"attention_backend":"B12X"}}' \
      --generation-config vllm \
      --override-generation-config '{{"top_p":0.95}}' \
      --reasoning-parser mimo \
      --tool-call-parser mimo \
      --enable-auto-tool-choice \
      --kv-cache-metrics \
      --enable-mfu-metrics
