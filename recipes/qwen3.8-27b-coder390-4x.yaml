# Recipe: Qwen3.8-27B-Coder390-DFlash2 (four-node TP=4)
#
# Serves the NVFP4 W4A16 quantization of the local dense coder checkpoint:
# /nas-1/models/qwen3.8/qwen3.8-27b-coder390-ethink-dflash2-nvfp4-w4a16
# (staged slug qwen3.8-27b-coder390-ethink-dflash2-nvfp4-w4a16), with its
# bundled FP8 DFlash2 drafter. cluster.env maps recipe
# `qwen3.8-27b-coder390-4x` -> that NVFP4 slug, so fes-weights mounts the
# quantized dir; `--quantization modelopt_mixed` selects the ModelOpt path
# (MLP+lm_head NVFP4 -> Marlin; attention FP8 -> FlashInfer FP8), KV stays fp8.
# The BF16 checkpoint remains on the NAS archive if a rollback is needed.
# The drafter is a real subdirectory of the checkpoint (DFlash2-FP8/), mounted
# at /model by mods/fes-weights. Its config.json is written for SGLang, so
# mods/qwen3.8-coder390-dflash stages a vLLM-loadable copy at
# /workspace/Qwen3.8-27B-Coder390-dflash and --speculative-config points
# there.
#
# This is the TP=4 variant of recipes/qwen3.8-27b-coder390-2x.yaml: the model
# id, container, build_args, mods, env block, and serve command are byte-for-
# byte identical to the 2x recipe; only the shard counts differ (tensor_parallel
# 4, draft_tensor_parallel_size 4) so the same NVFP4 weights spread across all
# four DGX Spark nodes.
#
# Architecturally this is a Qwen3.5 hybrid (16 full-attention + 48 Gated
# DeltaNet layers) with a vision tower, so the SSM/hybrid env block and
# --mamba-cache-mode align mirror recipes/qwen3.8-flash-next-nvfp4-cluster.yaml
# (same arch family, same b12x image). The DFlash2 spec-decode block mirrors
# recipes/qwen3.8-27b-nvfp4-dflash2.yaml.
#
# GDN kernels: --gdn-prefill-backend cutedsl selects the CuteDSL (b12x-
# derived) prefill kernel. This vLLM build (0.32) has no --gdn-decode-kernel
# flag, so none is passed; decode runs the default fused CUDA GDN kernel
# (VLLM_GDN_DECODE_KERNEL defaults to "cuda").
#
# Weight loader: --load-format instanttensor, not b12x. The b12x loader in
# this vLLM build is the opt-in Flash Next (Qwen4Exp) loader and rejects every
# other architecture outright (b12x_loader.py:119-126); this checkpoint is
# Qwen3_5ForConditionalGeneration, so b12x could never load it. instanttensor
# runs through the default safetensors iterator with a CUDA-resident read
# path and no architecture allow-list, matching the sibling
# recipes/qwen3.8-27b-nvfp4-dflash2.yaml for the same model family.
#
# Attention: no --attention-backend and --block-size 16 (image defaults).
# Commit caaba0f's B12X paged-attention arm cannot boot this model in the
# current image: BasePlatform._align_hybrid_block_size rewrites the block size
# to fit the mamba page size, while B12xPagedAttentionBackend only accepts
# page sizes 64/128 (v1/attention/backends/b12x.py:47), so
# _check_aligned_block_size raises "Aligned KV cache block size 1664 is not
# supported". See docs/b12x-coder390-attention-gap.md for the resolution paths.
#
# Image pin: image_id is the content ID of the build this recipe was validated
# against (vllm 0.32.0rc1.dev301+g1ac942555, flashinfer 0.7.2, built
# 2026-10-16). The `container:` tag alone cannot pin anything: tags are mutable
# and an unrecognised tag falls back to an upstream pull ref. The launcher
# refuses to start when the tag resolves to different content, which is what
# caught the flag/loader/block-size drift documented above. After deliberately
# re-validating on a new image, update both `container:` and `image_id:`.
#
# Pin state (2026-10-19): this remains the last validated build. The B12X
# storage-block patch and an NCCL install fix are committed in this repo but are
# NOT in any image yet -- two rebuild attempts produced images that could not
# serve. See docs/b12x-coder390-attention-gap.md, "Rebuilding this image: two
# traps", for the two failure modes and the hard stop on reproducing this
# vLLM commit from source. Do not repin until a rebuilt image has booted and
# passed the acceptance table.
#
# The `model:` id is synthetic (the checkpoint is not on the Hub); mods/fes-weights
# presents /model as an HF hub-cache shim under this exact id, so
# `vllm serve <id>` resolves offline with HF_HUB_OFFLINE=1.

recipe_version: "1"
name: Qwen3.8-27B-Coder390-DFlash2 (4x)
description: vLLM serving the NVFP4 W4A16 (ModelOpt mixed-precision) Qwen3.8-27B-Coder390 checkpoint with its bundled FP8 DFlash2 drafter, TP=4 across four DGX Spark nodes

model: local-inference-lab/Qwen3.8-27B-Coder390-DFlash2
container: vllm-node-b12x
image_id: sha256:f2aed1c24f65f44c8638801e3a0ba46b61c1753f7a02f24bb8f22dcbaacad842

build_args:
  - --exp-b12x

# TP=4 needs all four cluster nodes, so this recipe has no solo form; the CI
# recipe test therefore exercises the multi-node dry-run path instead of --solo.
cluster_only: true

# fes-weights must be the first mod: it verifies the staged weights and builds
# the offline hub-cache shim that `vllm serve <model>` resolves against.
mods:
  - mods/fes-weights
  - mods/qwen3.8-coder390-dflash
  - mods/b12x-kernel-cache
  # B12X_SKIP_RECLAIM is only the GATE - the patch that honours it lives in
  # this mod, so the env var alone does nothing (observed live 2026-10-15:
  # env set, worker still spun in _reclaim_programs).
  - mods/b12x-reclaim-gate

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 4
  gpu_memory_utilization: 0.75
  max_model_len: 262144
  max_num_seqs: 32
  max_num_batched_tokens: 16384
  max_cudagraph_capture_size: 256
  num_speculative_tokens: 7
  draft_tensor_parallel_size: 4

# Qwen3.5 hybrid (Gated DeltaNet + full attention) on the b12x stack.
# Same block as recipes/qwen3.8-flash-next-nvfp4-cluster.yaml.
env:
  CUTE_DSL_ARCH: "sm_121a"
  SAFETENSORS_FAST_GPU: "1"
  VLLM_WORKER_MULTIPROC_METHOD: "spawn"
  VLLM_SSM_CONV_STATE_LAYOUT: "DS"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_ENABLE_ROCE_ALLREDUCE: "1"
  VLLM_ROCE_ALLREDUCE_MAX_SIZE: "2MB"
  # b12x _reclaim_programs runs an unguarded O(exponential) retained-owner walk
  # plus an eager gc.collect() that spins at 100% CPU (GIL held) after graph
  # capture, wedging determine_available_memory -> the EngineCore collective
  # never returns and the ranks hang ("No available shared memory broadcast
  # block found in 60 seconds" repeating). Observed live 2026-10-15 on the
  # NVFP4 serve: Worker_TP1 parked in b12x/preparation/session.py:610 via
  # _release_b12x_profile_state. Same flag the NVFP4 MiMo recipe carries.
  # Skipping only leaves WeakValueDictionary-backed cache entries.
  B12X_SKIP_RECLAIM: "1"
  # Persist the torch inductor Triton autotuner cache outside /tmp so
  # b12x-kcache archives it (roots.txt entry "torchinductor"); otherwise it
  # is ephemeral and every boot re-compiles the Triton kernels.
  TORCHINDUCTOR_CACHE_DIR: "/root/.cache/torchinductor"

# The draft's FP8 quantization is auto-detected from its own config.json's
# quantization_config.quant_method ("fp8"); no --quantization flag is needed or
# wanted (SpeculativeConfig.quantization stays None, and the fp8 path engages
# anyway via ModelConfig._verify_quantization).
#
# The drafter's config ships SGLang-shaped modules_to_not_convert names, which
# vLLM's Fp8Config cannot match (exact-mode against "model."-rooted prefixes),
# so mods/qwen3.8-coder390-dflash rewrites the list into vLLM's naming space.
# Without that rewrite qkv_proj — whose q/k/v weights are BF16 here — gets
# Fp8LinearMethod and the DFlash fused context K/V projection dies with
# "expected mat1 and mat2 to have the same dtype ... BFloat16 != Float8_e4m3fn".
#
# num_speculative_tokens 7: DFlash2Qwen3Model sized its grouped-conv
# block_size as 1 + num_speculative_tokens, and the drafter's config pins
# dflash_config.block_size = 8, so 1 + 7 = 8 matches. 8 (the value the
# external-drafter recipe uses) would make block_size 9 and miss the
# block_size==8 fast path in qwen3_dflash2.py.
command: |
  b12x-kcache exec vllm serve local-inference-lab/Qwen3.8-27B-Coder390-DFlash2 \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --tensor-parallel-size {tensor_parallel} \
    --mamba-cache-mode align \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --async-scheduling \
    --dtype bfloat16 \
    --kv-cache-dtype fp8 \
    --block-size 16 \
    --quantization modelopt_mixed \
    --load-format instanttensor \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-cudagraph-capture-size {max_cudagraph_capture_size} \
    --speculative-config '{{"method":"dflash","model":"/workspace/Qwen3.8-27B-Coder390-dflash","num_speculative_tokens":{num_speculative_tokens},"draft_tensor_parallel_size":{draft_tensor_parallel_size}}}' \
    --gdn-prefill-backend cutedsl \
    --linear-backend b12x \
    --mm-encoder-tp-mode data \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_xml \
    --enable-auto-tool-choice \
    --enable-mfu-metrics \
    --kv-cache-metrics \
    --gpu-memory-utilization {gpu_memory_utilization}
