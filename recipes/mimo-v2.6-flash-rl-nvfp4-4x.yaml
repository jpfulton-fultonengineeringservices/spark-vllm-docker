# Recipe: MiMo-V2.6-Flash-RL-NVFP4 4x (b12x)
#
# TP=4 across four DGX Spark nodes using b12x-optimized serving stack:
# B12X attention (DiffKV + fp8 KV), b12x MoE (MXFP4), b12x linear, and b12x
# async checkpoint loading. NVFP4 requires the ModelOpt load bridge
# (`mods/mimo-v2.6-flash-rl-nvfp4`); no exl3-mimo.

recipe_version: "1"
name: MiMo-V2.6-Flash-RL-NVFP4 4x
description: vLLM serving XiaomiMiMo/MiMo-V2.6-Flash-RL-NVFP4 with DFlash speculative decoding on four-node DGX Spark cluster (TP=4, b12x stack)

model: XiaomiMiMo/MiMo-V2.6-Flash-RL-NVFP4

container: vllm-node-b12x

build_args:
  - --exp-b12x

cluster_only:

mods:
  - mods/fes-weights
  - mods/mimo-v2.6-flash
  - mods/mimo-v2.6-flash-rl-nvfp4
  - mods/mimo-diffkv-fp8-kv
  - mods/b12x-kernel-cache
  - mods/b12x-reclaim-gate

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 4
  gpu_memory_utilization: 0.68
  max_model_len: 1048576
  block_size: 128
  max_num_seqs: 32
  max_num_batched_tokens: 16384
  num_speculative_tokens: 7

env:
  CUTE_DSL_ARCH: "sm_121a"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  TORCHINDUCTOR_CACHE_DIR: "/root/.cache/torchinductor"
  # b12x _reclaim_programs runs an unguarded O(exponential) retained-owner walk
  # plus an eager gc.collect() that spins at 100% CPU (GIL held) forever after
  # graph capture, wedging determine_available_memory. The mod gates both behind
  # this flag; skipping only leaves WeakValueDictionary-backed cache entries.
  B12X_SKIP_RECLAIM: "1"

command: |
  b12x-kcache exec vllm serve XiaomiMiMo/MiMo-V2.6-Flash-RL-NVFP4 \
  --trust-remote-code \
  --host {host} \
  --port {port} \
  --tensor-parallel-size {tensor_parallel} \
  --quantization modelopt_mixed \
  --attention-backend B12X \
  --linear-backend b12x \
  --load-format b12x \
  --moe-backend b12x \
  --limit-mm-per-prompt '{{"image":0,"video":0,"audio":0}}' \
  --block-size {block_size} \
  --max-model-len {max_model_len} \
  --kv-cache-dtype fp8 \
  --kv-cache-dtype-skip-layers sliding_window \
  --max-num-seqs {max_num_seqs} \
  --max-num-batched-tokens {max_num_batched_tokens} \
  --gpu-memory-utilization {gpu_memory_utilization} \
  --enable-chunked-prefill \
  --async-scheduling \
  --enable-prefix-caching \
  --speculative-config '{{"method":"dflash","model":"/workspace/MiMo-V2.6-Flash-RL-dflash","num_speculative_tokens":{num_speculative_tokens},"attention_backend":"B12X"}}' \
  --compilation-config '{{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}}' \
  --generation-config vllm \
  --override-generation-config '{{"top_p":0.95}}' \
  --reasoning-parser mimo \
  --tool-call-parser mimo \
  --enable-auto-tool-choice \
  --kv-cache-metrics \
  --enable-mfu-metrics
