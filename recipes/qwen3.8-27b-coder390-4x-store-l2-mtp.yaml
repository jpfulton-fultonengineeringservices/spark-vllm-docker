# Recipe: Qwen3.8-27B-Coder390-MTP (four-node TP=4, durable Mooncake store L2)
#
# MTP-drafter variant (bundled BF16 MTP head, method "mtp") of the four-node
# store-L2 coder390 recipe. Uses the same NVFP4 W4A16 checkpoint and TP=4
# Mooncake store L2 topology as the DFlash2 sibling, but runs the
# publisher-validated MTP speculative decode path. The MTP head ships inside
# the main checkpoint as mtp.* tensors with mtp_num_hidden_layers=1.
#
# MooncakeStoreConnector (kv_both) fronts a shared store cohort (per-node DRAM
# + NVMe SSD offload) for durable prefix KV, chosen over native vLLM fs tier
# (cannot cross-rank assemble) and LMCache (lacks SupportsHMA for the Qwen3_5
# hybrid architecture). The store connector's content-hash key prefix is
# derived from the full KV-numerics config lineage to prevent silent KV
# corruption across config changes.
#
# Reasoning effort: the checkpoint's chat_template accepts only xhigh|medium|low
# (xhigh is the default); caller-side translation (high->xhigh, etc.) happens
# at the LiteLLM gateway, not here.

recipe_version: "1"
name: Qwen3.8-27B-Coder390-MTP (4x, durable Mooncake store L2)
description: vLLM serving the NVFP4 W4A16 (ModelOpt mixed-precision) Qwen3.8-27B-Coder390 checkpoint with its bundled BF16 MTP head (the publisher-validated vLLM speculative-decode path), TP=4 across four DGX Spark nodes, with a durable Mooncake store L2 KV cache (content-hash shared prefix pool + NVMe SSD offload)

model: local-inference-lab/Qwen3.8-27B-Coder390-DFlash2

container: vllm-node-b12x
# image_id: sha256:5a5530d173d7bca3264b7aced5a7f5d7b2a104ba3483fd5782ce1f51337d09c9

# TP=4 needs all four cluster nodes; CI tests the multi-node dry-run path.
cluster_only: true

mods:
  - mods/fes-weights
  - mods/qwen3.8-coder390-mtp
  # Keep target-index-aware tensor selection compatible with InstantTensor 0.2.2.
  - mods/instanttensor-selected-ranges
  # Preserve explicit "mtp": otherwise auto-detection sees the inherited draft
  # id's "DFlash2" and selects dflash, whose EAGLEConfig vocab_size read fails.
  - mods/fix-explicit-spec-method
  # Preserve native-base YaRN frequencies: the installed MRoPE class otherwise
  # multiplies the native context by four before applying the YaRN correction.
  - mods/qwen3.8-coder390-mrope-yarn
  - mods/b12x-kernel-cache
  # Commented out: env var alone does nothing; the patch lives in this mod.
  # - mods/b12x-reclaim-gate
  - mods/mooncake-worker
  - mods/mooncake-store-l2
  # Guards Mamba-align speculative-block relocation against hashed/shared
  # blocks exposed by the KV connector on external prefix hits.
  - mods/mamba-spec-relocate-guard
  # FES fork perf.py MFU corrections: modelopt_mixed weight bytes, hybrid
  # attention accounting, GDN FLOPs. Activated by FIX_MFU_METRICS env var.
  - mods/fix-mfu-metrics

# enable_lookup=true (see --kv-transfer-config below). Lookups were initially
# disabled (a87632d7a0) after the first store loads collapsed DFlash2
# spec-decode acceptance (segment collapse: block_len was 5x the real page,
# storing only 1 of 5 fused layer slots; the drafter's group was also swept
# by store loads). Both root causes are now fixed in the vendored store
# connector (mod-deployed, no image change): per-group segments derived from
# KVCacheTensor metadata, and drafter-group exclusion from save/load/lookup.
#
# Cross-boot durability remains open (D1): batch_is_exist returns false for
# keys from a different client session (0/30 cross-boot vs 30/30 same-boot).
# Same-boot external loads are what this recipe serves today.

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 4
  # 0.50 (not the base recipe's 0.75): the Mooncake store cohort co-tenants the
  # GB10 unified pool and the connector pins 2x2048 MiB host-staging slots
  # after vLLM sizes KV. 0.65 drove node 0 free on the 2x sibling.
  gpu_memory_utilization: 0.50
  # Long-context YaRN: native 262144, factor 4, advertised maximum 1048576.
  # Current vLLM expects the advertised maximum already scaled for YaRN; the
  # draft inherits it through the MTP override and no longer clips to 262144.
  max_model_len: 1048576
  # 8 (raised from 6 after master-side allocation fixes). Revert to 6 if
  # master_put_start_alloc_failures_total climbs on the gx10-mooncake dashboard.
  max_num_seqs: 8
  # 2048 - 4096 - 8192 - 16384 - 32768 - 65536 - 131072 - 262144 - 524288 - 1048576
  max_num_batched_tokens: 4096
  # max_cudagraph_capture_size: 256
  # 3 per the model card's vLLM MTP prescription. Single MTP layer
  # (mtp_num_hidden_layers=1) runs autoregressively per decode step.
  num_speculative_tokens: 3

env:
  FES_WEIGHTS_SLUG: "qwen3.8-27b-coder390-ethink-dflash2-nvfp4-w4a16"
  FIX_EXPLICIT_SPEC_METHOD: "1"
  CUTE_DSL_ARCH: "sm_121a"
  SAFETENSORS_FAST_GPU: "1"
  VLLM_WORKER_MULTIPROC_METHOD: "spawn"
  VLLM_SSM_CONV_STATE_LAYOUT: "DS"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_ENABLE_ROCE_ALLREDUCE: "1"
  VLLM_ROCE_ALLREDUCE_MAX_SIZE: "2MB"
  # B12X_SKIP_RECLAIM: bypasses O(exponential) retained-owner walk and
  # gc.collect() that wedges the EngineCore collective (observed live 2026-10-15).
  B12X_SKIP_RECLAIM: "1"
  # Persist torch inductor Triton cache outside /tmp for kcache archiving.
  TORCHINDUCTOR_CACHE_DIR: "/root/.cache/torchinductor"
  # Required by the CLI parser even though the advertised maximum now matches.
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  # --- durable Mooncake store L2 ---
  MOONCAKE_L2_ENABLED: "1"
  MOONCAKE_WORKER_P2P: "skip"
  MOONCAKE_CONFIG_PATH: "/tmp/mooncake-store.json"
  PYTHONHASHSEED: "0"
  MAMBA_SPEC_RELOCATE_GUARD: "1"
  FIX_MFU_METRICS: "1"
  # GC lease on batch_get offload buffers (ms); must outlive the NAS read of
  # a full 1 GiB staged chunk (~4.8 s at ~225 MB/s).
  MOONCAKE_OFFLOAD_CLIENT_BUFFER_GC_TTL_MS: "60000"

# Staging slot size 1024 MiB (halved from 2048). At 2048, peak in-flight demand
# was 4 GiB against ~3.4 GiB free per segment, triggering master rejections
# (NO_AVAILABLE_HANDLE -200). 1024 halves peak demand to 2 GiB. This is a
# capacity fix only: failed puts are not a correctness bug (content-addressed
# keys yield a shorter prefix hit and recompute on failure).

# cache_prefix = {cache_lineage_prefix} (sha256 over model + container +
# image_id + KV-relevant defaults + full command). Prevents silent KV
# corruption when numerics change: an empty prefix would make an older
# deployment's KV indistinguishable from a current one. A config change
# orphans the previous lineage's buckets rather than aliasing onto them.

# The MTP head's BF16 tensors must stay BF16 under modelopt_mixed.
# mods/qwen3.8-coder390-mtp checks the safetensors headers for BF16 MTP weights
# and ensures MTP exclusion-list entries; it does not inspect quantized_layers.
#
# NO disable_eagle_block_drop here -- deliberate. MTP builds draft KV from
# hidden state AND the next token, so the trailing prefix-cache block drop
# must stay ENABLED (the field defaults to false, so it's simply absent).
#
# mtp_num_hidden_layers:1 is pinned top-level in --hf-overrides so it
# survives text_config-scoped rope overrides independent of engine vintage.
# No top-level vocab_size override is needed: the checkpoint declares it only
# under text_config, compose_draft_hf_overrides drops target overrides, and
# explicit method "mtp" avoids EAGLEConfig's top-level vocab_size read.
#
# NOTE: comments must stay OUT of the command body -- a comment between
# line-continuations truncates the rendered exec-script (observed live).
command: |
  # vLLM hard-rejects KV connectors with expandable_segments (config/vllm.py:952-970).
  unset PYTORCH_CUDA_ALLOC_CONF
  b12x-kcache exec vllm serve local-inference-lab/Qwen3.8-27B-Coder390-DFlash2 \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --tensor-parallel-size {tensor_parallel} \
    --async-scheduling \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --kv-cache-dtype fp8 \
    --quantization modelopt_mixed \
    --load-format instanttensor \
    --hf-overrides '{{"text_config":{{"max_position_embeddings":1048576,"rope_parameters":{{"mrope_interleaved":true,"mrope_section":[11,11,10],"partial_rotary_factor":0.25,"rope_theta":10000000,"rope_type":"yarn","factor":4.0,"original_max_position_embeddings":262144}}}},"mtp_num_hidden_layers":1}}' \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":{num_speculative_tokens}}}' \
    --kv-transfer-config '{{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_both","kv_load_failure_policy":"recompute","kv_connector_extra_config":{{"host_staging":true,"staging_num_slots":2,"staging_slot_size_mb":1024,"enable_lookup":true,"cache_prefix":"{cache_lineage_prefix}"}}}}' \
    --mm-encoder-tp-mode data \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_xml \
    --enable-auto-tool-choice \
    --enable-mfu-metrics \
    --kv-cache-metrics \
    --kv-cache-metrics-sample 1.0 \
    --gpu-memory-utilization {gpu_memory_utilization}
