# Recipe: Qwen3.8-27B-Coder390-MTP (two-node TP=2, durable Mooncake store L2)
#
# MTP-drafter variant (bundled BF16 MTP head, method "mtp") of the two-node
# store-L2 coder390 recipe. Uses the same NVFP4 W4A16 checkpoint and TP=2
# Mooncake store L2 topology as the DFlash2 sibling, but runs the
# publisher-validated MTP speculative decode path. The MTP head ships inside
# the main checkpoint as mtp.* tensors with mtp_num_hidden_layers=1.
#
# MooncakeStoreConnector (kv_both) fronts a shared store cohort (per-node DRAM
# + NVMe SSD offload) for durable prefix KV, chosen over native vLLM fs tier
# (cannot cross-rank assemble) and LMCache (lacks SupportsHMA for the Qwen3_5
# hybrid architecture). The store connector's content-hash key prefix is
# derived from the full KV-numerics config lineage to prevent silent KV
# corruption across config changes.
#
# Reasoning effort: the checkpoint's chat_template accepts only xhigh|medium|low
# (xhigh is the default); caller-side translation (high->xhigh, etc.) happens
# at the LiteLLM gateway, not here.

recipe_version: "1"
name: Qwen3.8-27B-Coder390-MTP (2x, durable Mooncake store L2)
description: vLLM serving the NVFP4 W4A16 (ModelOpt mixed-precision) Qwen3.8-27B-Coder390 checkpoint with its bundled BF16 MTP head (the publisher-validated vLLM speculative-decode path), TP=2 across two DGX Spark nodes, with a durable Mooncake store L2 KV cache (content-hash shared prefix pool + NVMe SSD offload)

model: local-inference-lab/Qwen3.8-27B-Coder390-DFlash2
#
# Pin state (2026-10-19): last validated build. See
# docs/b12x-coder390-attention-gap.md before repinning.
container: vllm-node-b12x
image_id: sha256:e9f6e32941ec5680a58edfbfefaad6997f0527e22344b5b505cf8267de4625f2

# TP=2 needs both cluster nodes; CI tests the multi-node dry-run path.
cluster_only: true

build_args:
  - --exp-b12x

mods:
  - mods/fes-weights
  - mods/qwen3.8-coder390-mtp
  # Commented out: auto-detect rewrites method "mtp" -> dflash when the draft
  # id contains "DFlash2", then EAGLEConfig's vocab_size read kills boot.
  # - mods/fix-explicit-spec-method
  - mods/b12x-kernel-cache
  # Commented out: env var alone does nothing; the patch lives in this mod.
  # - mods/b12x-reclaim-gate
  - mods/mooncake-worker
  - mods/mooncake-store-l2
  # Guards Mamba-align speculative-block relocation against hashed/shared
  # blocks exposed by the KV connector on external prefix hits.
  - mods/mamba-spec-relocate-guard
  # FES fork perf.py MFU corrections: modelopt_mixed weight bytes, hybrid
  # attention accounting, GDN FLOPs. Activated by FIX_MFU_METRICS env var.
  - mods/fix-mfu-metrics

# enable_lookup=true (see --kv-transfer-config below). Two root causes fixed
# in the vendored store connector (mod-deployed, no image change):
# 1. Segment collapse: block_len was 5x the real page, storing only 1 of 5
#    fused layer slots. Now derived per-group from KVCacheTensor metadata.
# 2. Drafter sweep: the MTP head's layer group was being loaded with target
#    page addressing, corrupting head KV. Now excluded from save/load/lookup.
#
# Cross-boot durability remains open (D1): batch_is_exist returns false for
# keys from a different client session (0/30 cross-boot vs 30/30 same-boot).
# Same-boot external loads are what this recipe serves today.

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  # 0.50 (not the base recipe's 0.75): the Mooncake store cohort co-tenants the
  # GB10 unified pool and the connector pins 2x2048 MiB host-staging slots
  # after vLLM sizes KV. 0.65 drove node 0 free on the 2x sibling.
  gpu_memory_utilization: 0.50
  # Long-context YaRN: --hf-overrides scales rope 4x (262144 -> 1048576).
  max_model_len: 1048576
  # 8 (raised from 6 after master-side allocation fixes). Revert to 6 if
  # master_put_start_alloc_failures_total climbs on the gx10-mooncake dashboard.
  max_num_seqs: 8
  # 2048 -> 32768: MTP spec decode runs 3 autoregressive iterations per decode
  # step, so a wider window lets the head fill more positions per iteration.
  max_num_batched_tokens: 32768
  # max_cudagraph_capture_size: 256
  # 3 per the model card's vLLM MTP prescription. Single MTP layer
  # (mtp_num_hidden_layers=1) runs autoregressively per decode step.
  num_speculative_tokens: 3

# Qwen3.5 hybrid (Gated DeltaNet + full attention) on the b12x stack.
# Same block as recipes/qwen3.8-flash-next-nvfp4-cluster.yaml.
env:
  # CCI injects this as a container -e before applying mods; run.sh also
  # recognizes the flag in a previously rendered exec-script on re-apply.
  FIX_EXPLICIT_SPEC_METHOD: "1"
  CUTE_DSL_ARCH: "sm_121a"
  SAFETENSORS_FAST_GPU: "1"
  VLLM_WORKER_MULTIPROC_METHOD: "spawn"
  VLLM_SSM_CONV_STATE_LAYOUT: "DS"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_ENABLE_ROCE_ALLREDUCE: "1"
  VLLM_ROCE_ALLREDUCE_MAX_SIZE: "2MB"
  # B12X_SKIP_RECLAIM: bypasses O(exponential) retained-owner walk and
  # gc.collect() that wedges the EngineCore collective (observed live 2026-10-15).
  B12X_SKIP_RECLAIM: "1"
  # Persist torch inductor Triton cache outside /tmp for kcache archiving.
  TORCHINDUCTOR_CACHE_DIR: "/root/.cache/torchinductor"
  # Long-context YaRN: permit --max-model-len above the 262144 native cap.
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  # --- durable Mooncake store L2 ---
  MOONCAKE_WORKER_P2P: "skip"
  MOONCAKE_CONFIG_PATH: "/tmp/mooncake-store.json"
  PYTHONHASHSEED: "0"
  MAMBA_SPEC_RELOCATE_GUARD: "1"
  FIX_MFU_METRICS: "1"
  # GC lease on batch_get offload buffers (ms); must outlive the NAS read of
  # a full 1 GiB staged chunk (~4.8 s at ~225 MB/s).
  MOONCAKE_OFFLOAD_CLIENT_BUFFER_GC_TTL_MS: "60000"

# Staging slot size 1024 MiB, not 2048 (2026-11-03). `_pack_staging_chunks`
# bounds each store RPC by `slot_size`, and `staging_num_slots` chunks can be
# in flight at once — so the connector's peak store demand is
# num_slots * slot_size = 2 GiB, not the whole batch. At 2048 that peak was
# 4 GiB against ~3.4 GiB free per 24 GiB segment, and the master rejected
# allocations with NO_AVAILABLE_HANDLE (-200):
#
#   W client_service.cpp:3097 BatchPut failed for 509 keys due to
#     insufficient space
#   W worker.py:1249 batch_put failed: 527/963 keys failed (codes={-200},
#     batch_bytes=3713458176)
#
# Observed batch sizes reached 4.25 GiB, so a single chunk could also exceed
# one segment's free space outright. 1024 halves peak in-flight demand to
# 2 GiB (comfortably under 3.4 GiB free) and halves the pinned host memory
# the pool registers — which matters here: the ranks run at 7-11 GiB free of
# 120 GiB, so the previous 2x2048 MiB pin was a real co-tenancy cost.
#
# This is a CAPACITY fix only. A failed put is not a correctness bug: store
# keys are content-addressed and lookup returns the longest CONTIGUOUS
# prefix hit, so a rejected batch yields a shorter hit and recompute — it
# cannot make the model attend to KV that does not match its context. Do not
# cite -200 as the cause of degenerate output.

# cache_prefix = {cache_lineage_prefix} (derived by run-recipe.py, 2026-11-03).
#
# Mooncake keys are `{cache_prefix}@{model}@tp_rank:N@pcp0@dcp0@pp_rank:0@
# @group:G@{token_hash}`. The token hash covers TOKENS ONLY — it encodes no
# quantization, rope/YaRN factor, kv-cache dtype, block size, or image
# version. With an empty prefix, a bucket written by an earlier deployment
# (different numerics, same model name) is indistinguishable from a current
# one: the lookup hits, load_get succeeds, and the engine attends to KV
# computed under a different config lineage. That is silent KV corruption and
# presents as coherent output that degrades into a repetition loop.
#
# The prefix is a sha256 over model + container + image_id + the KV-relevant
# defaults + the full command, so it changes automatically whenever anything
# that determines KV numerics changes. Rank/topology knobs (tensor_parallel,
# gpu_memory_utilization, max_num_seqs) are deliberately excluded: all ranks
# share one namespace and the key already carries tp_rank per shard.
#
# Consequence: a config change orphans the previous lineage's buckets rather
# than aliasing onto them. Old buckets are unreachable, not corrupting; they
# age out via the bucket LRU. Wiping the offload dir is safe but no longer
# required for correctness.

# The MTP head's BF16 tensors must stay BF16 under modelopt_mixed. The
# checkpoint already exempts them twice: hf_quant_config.json (the file
# vLLM's ModelOpt configs read, per get_config_filenames) carries
# quantization.exclude_modules ["mtp*","mtp.layers.0*"] -- ModelOpt exclude
# lists are wildcards, matched with fnmatch in
# ModelOptQuantConfigBase.is_layer_excluded -- and no mtp.* prefix appears
# in quantized_layers (ModelOptMixedPrecisionConfig leaves any prefix absent
# from that map unquantized). mods/qwen3.8-coder390-mtp VERIFIES both at
# boot and injects the wildcard entries into the served copy if a future
# re-quantization ever drops them.
#
# NO disable_eagle_block_drop here -- and that is deliberate. Upstream
# #54163's analysis: only EAGLE/EAGLE3/MTP actually REQUIRE the trailing
# prefix-cache block drop, because MTP builds draft KV from the hidden
# state AND the next token (DFlash builds it from hidden state alone, which
# is why the DFlash2 sibling opts out). The drop must stay ENABLED for MTP:
# the field defaults to false, so it is simply absent below.
#
# mtp_num_hidden_layers:1 is pinned top-level in --hf-overrides below. The
# checkpoint declares the field under text_config only; SpeculativeConfig
# reads it top-level first and treats text_config as a fallback
# (speculative.py:1086-1089), so the top-level pin keeps MTP depth
# resolution independent of engine vintage -- and survives the
# text_config-scoped rope override in the same flag.
#
# No top-level vocab_size override is needed or effective here. The
# checkpoint declares it only under text_config; the draft ModelConfig
# receives only SpeculativeConfig.hf_config_override because
# compose_draft_hf_overrides drops target dictionary overrides. Explicit
# method "mtp" avoids EAGLEConfig (which reads top-level vocab_size) via
# mods/fix-explicit-spec-method; the checkpoint's existing text_config value
# needs no separate top-level pin.
#
# method "mtp": no model path (the head ships inside the main checkpoint),
# no draft_tensor_parallel_size (draft runs at target TP), no
# disable_eagle_block_drop (EAGLE/EAGLE3/MTP REQUIRE the trailing-block drop,
# per upstream #54163). NOTE: comments must stay OUT of the command body --
# a comment between line-continuations truncates the rendered exec-script
# (observed live: "--speculative-config: command not found", engine booted
# arg-less and died on world-size validation).
command: |
  # The store connector host-stages KV through pinned slots, and vLLM
  # hard-rejects any KV connector with expandable_segments
  # (config/vllm.py:952-970). Same belt-and-suspenders as
  # mods/pd-disagg/dispatch.sh.
  unset PYTORCH_CUDA_ALLOC_CONF
  b12x-kcache exec vllm serve local-inference-lab/Qwen3.8-27B-Coder390-DFlash2 \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --tensor-parallel-size {tensor_parallel} \
    --mamba-cache-mode align \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --async-scheduling \
    --dtype bfloat16 \
    --kv-cache-dtype fp8 \
    --block-size 16 \
    --quantization modelopt_mixed \
    --load-format instanttensor \
    --hf-overrides '{{"text_config":{{"rope_parameters":{{"mrope_interleaved":true,"mrope_section":[11,11,10],"partial_rotary_factor":0.25,"rope_theta":10000000,"rope_type":"yarn","factor":4.0,"original_max_position_embeddings":262144}}}},"mtp_num_hidden_layers":1}}' \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-cudagraph-capture-size {max_cudagraph_capture_size} \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":{num_speculative_tokens}}}' \
    --kv-transfer-config '{{"kv_connector":"MooncakeStoreConnector","kv_role":"kv_both","kv_load_failure_policy":"recompute","kv_connector_extra_config":{{"host_staging":true,"staging_num_slots":2,"staging_slot_size_mb":1024,"enable_lookup":true,"cache_prefix":"{cache_lineage_prefix}"}}}}' \
    --gdn-prefill-backend cutedsl \
    --linear-backend b12x \
    --mm-encoder-tp-mode data \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_xml \
    --enable-auto-tool-choice \
    --enable-mfu-metrics \
    --kv-cache-metrics \
    --kv-cache-metrics-sample 1.0 \
    --gpu-memory-utilization {gpu_memory_utilization}
