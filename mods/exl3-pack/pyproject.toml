[project]
name = "exl3pack"
version = "0.1.0"
description = "Shared EXL3 pack builder (convert + repack + assemble) for GB10 / b12x, with per-model specs and node-local source resolution."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Runtime deps supplied by the b12x image. On a host they are NOT required for
# the torch-free suite; install `hosttest` instead to also run the assemble +
# FP8-dispatch suites with a CPU torch.
runtime = ["torch", "safetensors"]
dev = ["pytest", "ruff", "mypy"]
# CPU torch + numpy so the torch-dependent tests (assemble e2e, FP8 dispatch)
# run on the host. CPU-only index keeps this small and Mac/Linux-portable.
hosttest = ["pytest", "ruff", "mypy", "torch", "safetensors", "numpy"]

[project.scripts]
exl3-pack = "exl3pack.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exl3pack"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/exl3pack"]
mypy_path = "src"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "safetensors", "safetensors.*", "b12x", "b12x.*", "exllamav3", "exllamav3.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
