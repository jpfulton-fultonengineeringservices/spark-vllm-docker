# Same model through the Dell LiteLLM gateway.
# Requires LITELLM_API_KEY in the environment.
# NOTE: arc_easy is absent - multiple_choice tasks need loglikelihood, which
# the chat-completions path does not provide.

[run]
name        = "mimo-nvfp4-litellm"
tasks       = ["humaneval_instruct", "mmmu_val"]
num_fewshot = 0
batch_size  = 1
limit       = 0
output_dir  = "results"
log_samples = true
seed        = "0,1234,1234,1234"
apply_chat_template = true

[model]
backend           = "local-chat-completions"
base_url          = "https://dell.fulton-home.fultonengineeringservices.com/litellm/v1/chat/completions"
model             = "cluster/mimo-v2.6-flash-rl-nvfp4"
tokenizer_backend = "none"
num_concurrent    = 1
max_images        = 3
auth_token_env    = "LITELLM_API_KEY"

[zeno]
enabled     = false
endpoint    = "http://127.0.0.1:8080"
project     = "mimo-nvfp4-4x"
api_key_env = "ZENO_API_KEY"
